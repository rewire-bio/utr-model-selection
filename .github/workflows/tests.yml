name: Companion tests and historical evidence
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.2'
      - run: make test
      - run: python3 scripts/paper_extract.py
      - run: git diff --exit-code -- paper/generated
